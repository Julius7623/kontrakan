<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f6f5c">

<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f2f5f4;color:#1b2a27;padding-bottom:env(safe-area-inset-bottom)}
header{background:#1f6f5c;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;font-weight:700;font-size:18px}
nav{display:flex;position:sticky;top:0;background:#fff;border-bottom:1px solid #d5dedb;z-index:5}
nav button{flex:1;padding:14px 4px;border:0;background:none;font-size:15px;font-weight:600;color:#6a7d78}
nav button.on{color:#1f6f5c;border-bottom:3px solid #1f6f5c}
main{max-width:820px;margin:auto;padding:14px}
.tab{display:none}.tab.on{display:block}
fieldset{background:#fff;border:1px solid #d5dedb;border-radius:14px;margin:0 0 14px;padding:12px 14px}
legend{font-weight:700;color:#1f6f5c;padding:0 6px}
label{display:block;font-size:13px;color:#4b5f5a;margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #c3cfcb;border-radius:10px;background:#fff;font-family:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#1f6f5c;color:#fff;font-size:16px;font-weight:700;margin:10px 0}
.btn.o{background:#fff;color:#1f6f5c;border:2px solid #1f6f5c}.btn.r{background:#b3372f}
.sum{background:#e3f1ec;border-radius:12px;padding:12px;font-size:15px;line-height:1.6}
.paper{background:#fff;padding:22px 20px;border:1px solid #cfd8d5;font-family:"Times New Roman",serif;font-size:15px;line-height:1.55;text-align:justify}
.paper h2{text-align:center;margin:0 0 4px;font-size:18px;text-decoration:underline}.paper .c{text-align:center}
.paper table.k td{padding:1px 6px 1px 0;vertical-align:top}
.paper h4{text-align:center;margin:14px 0 4px}.paper p{margin:4px 0}
.sign{display:flex;justify-content:space-between;text-align:center;margin-top:20px}.sign div{width:45%}.sign .sp{height:70px}
table.inv{width:100%;border-collapse:collapse;margin:12px 0}table.inv th,table.inv td{border:1px solid #444;padding:6px 8px;text-align:left}
.r2{text-align:right!important}
.h{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #d5dedb;border-radius:12px;padding:10px;margin-bottom:8px}
.h div{flex:1}.h button{padding:8px 12px;border-radius:8px;border:1px solid #1f6f5c;background:#fff;color:#1f6f5c;font-weight:600}
@media print{header,nav,.no{display:none!important}body{background:#fff}main{padding:0;max-width:none}.paper{border:0;padding:0}.tab{display:none!important}.tab.pr{display:block!important}}
.paper h4{line-height:1.3}.paraf{display:none}
.iv{padding:0!important;font-family:system-ui,sans-serif!important;text-align:left!important;border-radius:16px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ih{background:linear-gradient(135deg,#1f6f5c,#2f9a80);color:#fff;padding:22px 20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.it{font-size:28px;font-weight:800;letter-spacing:3px}.ib{padding:6px 14px;border-radius:99px;font-weight:700;font-size:13px;background:#fff;white-space:nowrap}.ib.ok{color:#1f6f5c}.ib.bk{color:#b3372f}
.ibody{padding:18px 20px}.ig{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ic{background:#f2f7f5;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45}.ic small{display:block;color:#6a7d78;font-weight:700;font-size:11px;letter-spacing:1px;margin-bottom:3px}.ic b{display:block}
.it2{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}.it2 th{background:#1f6f5c;color:#fff;padding:9px;text-align:left}.it2 td{padding:10px 9px;border-bottom:1px solid #e1e8e5}.it2 .r2{text-align:right}
.tt{margin-left:auto;width:min(100%,300px);font-size:14px}.tt div{display:flex;justify-content:space-between;padding:5px 0}.tt .big{background:#1f6f5c;color:#fff;border-radius:12px;padding:12px;font-size:17px;font-weight:800;margin-top:6px}
.pay{border:2px dashed #9cc3b8;border-radius:12px;padding:10px 12px;margin-top:14px;font-size:14px;line-height:1.5}.ty{text-align:center;color:#6a7d78;font-size:13px;margin-top:16px}
@media print{.paraf{display:block;position:fixed;bottom:0;right:0;font-size:12px}.iv{border-radius:0}@page{margin:16mm}}
</style></head><body>
<header>🏠 Surat Kontrak Rumah</header>
<nav class="no"><button data-t="f" class="on">Isi Data</button><button data-t="s">Surat</button><button data-t="v">Invoice</button><button data-t="h">Riwayat</button></nav>
<main>
<div id="f" class="tab on no"><div id="form"></div>
<div class="sum" id="sum"></div>
<button class="btn" id="save">💾 Simpan ke Riwayat</button>
<button class="btn o" id="new">Kosongkan Form (data pemilik tetap)</button></div>
<div id="s" class="tab"><button class="btn no" onclick="pr('s')">🖨️ Cetak / Simpan PDF</button><div class="paper" id="surat"></div></div>
<div id="v" class="tab"><button class="btn no" onclick="pr('v')">🖨️ Cetak / Simpan PDF</button><div class="paper iv" id="inv"></div></div>
<div id="h" class="tab no"><div id="hist"></div></div>
</main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),today=iso(new Date());
const F=[
['Data Pemilik — tersimpan otomatis',[['o_nama','Nama lengkap'],['o_tmp','Tempat lahir'],['o_lhr','Tanggal lahir','date'],['o_kerja','Pekerjaan','text','Wiraswasta'],['o_alamat','Alamat tempat tinggal','textarea'],['o_nik','NIK','tel'],['o_hp','No. HP','tel'],['o_bank','Nama bank','text','PT Bank Negara Indonesia (Persero) Tbk (BNI)'],['o_norek','Nomor rekening','tel'],['o_an','Nama pemilik rekening']]],
['Data Penyewa',[['p_nama','Nama lengkap'],['p_tmp','Tempat lahir'],['p_lhr','Tanggal lahir','date'],['p_wn','Kewarganegaraan','select','WNI',['WNI','WNA']],['p_negara','Negara asal (khusus WNA)'],['p_idno','NIK (WNI) / Nomor Paspor (WNA)'],['p_exp','Paspor berlaku sampai (khusus WNA)','date'],['p_kerja','Pekerjaan (WNI)'],['p_alamat','Alamat sesuai KTP (WNI)','textarea'],['p_hp','No. HP','tel']]],
['Objek Sewa (Rumah)',[['r_lantai','Jumlah lantai','text','1 (satu) lantai'],['r_listrik','Daya listrik PLN (Watt)','number'],['r_air','Sumber air','text','sumur bor'],['r_shm','Nomor Hak Milik tanah'],['r_luas','Luas tanah (m2)','number'],['r_akta','Akta Jual Beli (tanggal & nomor)'],['r_sert','Tanggal sertipikat','date'],['r_lokasi','Lokasi lengkap (Provinsi, Kabupaten, Kecamatan, Desa, Jalan)','textarea']]],
['Jangka Waktu & Biaya',[['mulai','Tanggal mulai sewa','date',today],['dur','Lama sewa','number','1'],['sat','Satuan','select','tahun',['bulan','tahun']],['harga','Harga sewa per satuan (Rp)','number'],['dp','Sudah dibayar (Rp) — untuk invoice','number','0']]],
['Surat',[['tgl','Tanggal surat','date',today],['pn','Pengadilan Negeri','text','Denpasar'],['catat','Pasal tambahan (opsional)','textarea']]]];
const OWN=['o_nama','o_tmp','o_lhr','o_kerja','o_alamat','o_nik','o_hp','o_bank','o_norek','o_an'];
$('#form').innerHTML=F.map(([t,fs])=>`<fieldset><legend>${t}</legend>`+fs.map(([id,l,ty,d,op])=>`<label for="${id}">${l}</label>`+(ty=='textarea'?`<textarea id="${id}" rows="2"></textarea>`:ty=='select'?`<select id="${id}">${op.map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="${id}" type="${ty||'text'}" ${ty=='number'?'inputmode="numeric" min="0"':''}>`)).join('')+'</fieldset>').join('');
const ids=F.flatMap(x=>x[1].map(y=>y[0]));
function setAll(d){ids.forEach(i=>{const f=F.flatMap(x=>x[1]).find(y=>y[0]==i);$('#'+i).value=d[i]??f[3]??''})}
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
setAll(Object.assign({},ld('owner')||{}));
const get=()=>Object.fromEntries(ids.map(i=>[i,$('#'+i).value.trim()]));
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const sat=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
function tb(n){n=Math.floor(n);if(n<12)return sat[n];if(n<20)return tb(n-10)+' belas';if(n<100)return tb(n/10)+' puluh'+(n%10?' '+tb(n%10):'');if(n<200)return 'seratus'+(n%100?' '+tb(n%100):'');if(n<1e3)return tb(n/100)+' ratus'+(n%100?' '+tb(n%100):'');if(n<2e3)return 'seribu'+(n%1e3?' '+tb(n%1e3):'');if(n<1e6)return tb(n/1e3)+' ribu'+(n%1e3?' '+tb(n%1e3):'');if(n<1e9)return tb(n/1e6)+' juta'+(n%1e6?' '+tb(n%1e6):'');return tb(n/1e9)+' miliar'+(n%1e9?' '+tb(n%1e9):'')}
const rpw=n=>n?tb(n)+' rupiah':'nol rupiah';
const D=(s,w)=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID',w?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{day:'numeric',month:'long',year:'numeric'}):'...';
function addM(s,m){const d=new Date(s+'T00:00:00'),day=d.getDate();d.setMonth(d.getMonth()+m);if(d.getDate()<day)d.setDate(0);return iso(d)}
function calc(v){const dur=+v.dur||0,h=+v.harga||0,tot=dur*h,dp=+v.dp||0;const bln=v.sat=='tahun'?dur*12:dur;return{dur,h,tot,dp,sisa:tot-dp,akhir:v.mulai?addM(v.mulai,bln):'',lama:dur+' ('+tb(dur)+') '+v.sat}}
const B=s=>esc(s)||'................';
function render(){const v=get(),c=calc(v),wna=v.p_wn=='WNA';
$('#sum').innerHTML=`Lama: <b>${c.lama}</b><br>Berakhir: <b>${D(c.akhir)}</b><br>Total sewa: <b>${rp(c.tot)}</b><br>Dibayar: ${rp(c.dp)} · Sisa: <b>${rp(c.sisa)}</b>`;
const U=x=>`<b style="text-transform:uppercase">${B(x)}</b>`,lhr=(t,d)=>`lahir di ${B(t)}, pada tanggal ${D(d)}`,DW=s=>{if(!s)return '...';const d=new Date(s+'T00:00:00');return tb(d.getDate())+' bulan '+d.toLocaleDateString('id-ID',{month:'long'}).replace(/^./,x=>x.toUpperCase())+' tahun '+tb(d.getFullYear())+' ('+s.split('-').reverse().join('-')+')'};
const wd=v.tgl?new Date(v.tgl+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long'}):'...';
const P=(n,t,b)=>`<h4>Pasal ${n}<br>${t}</h4>${b}`,q=t=>`<p>${t}</p>`,w=+v.r_listrik||0,lu=+v.r_luas||0;
const pen=wna?`${U(v.p_nama)}, ${lhr(v.p_tmp,v.p_lhr)}, Warga Negara ${B(v.p_negara)} (Warga Negara Asing), pemegang Paspor ${B(v.p_negara)} Nomor ${B(v.p_idno)} yang berlaku sampai dengan tanggal ${D(v.p_exp)}, yang selama jangka waktu sewa bertempat tinggal di rumah yang disewa sebagaimana diuraikan di bawah ini;`:`${U(v.p_nama)}, ${lhr(v.p_tmp,v.p_lhr)}, Warga Negara Indonesia, ${B(v.p_kerja)}, bertempat tinggal di ${B(v.p_alamat)}, pemegang Kartu Tanda Penduduk dengan Nomor Induk Kependudukan: ${B(v.p_idno)};`;
$('#surat').innerHTML=`<h2>PERJANJIAN SEWA MENYEWA</h2>
${q(`Pada hari ini, ${wd}, tanggal ${DW(v.tgl)}, dibuat dan ditandatangani Perjanjian Sewa Menyewa (untuk selanjutnya disebut ‘Perjanjian’), oleh dan antara:`)}
${q(`1. ${U(v.o_nama)}, ${lhr(v.o_tmp,v.o_lhr)}, Warga Negara Indonesia, ${B(v.o_kerja)}, bertempat tinggal di ${B(v.o_alamat)}, pemegang Kartu Tanda Penduduk dengan Nomor Induk Kependudukan: ${B(v.o_nik)};<br>“selanjutnya disebut <b>PEMILIK</b>”`)}
${q(`2. ${pen}<br>“selanjutnya disebut <b>PENYEWA</b>”`)}
${q('PEMILIK dan PENYEWA secara bersama-sama disebut “PARA PIHAK”. PARA PIHAK menerangkan terlebih dahulu hal-hal sebagai berikut:')}
${q(`A. Bahwa PEMILIK dengan ini menyewakan kepada PENYEWA dan PENYEWA menerangkan menerima persewaan dari PEMILIK, berupa: (Rumah) ${B(v.r_lantai)}, dilengkapi dengan aliran listrik dari Perusahaan Listrik Negara (PLN) sebesar ${w} (${tb(w)}) Watt, air dari ${B(v.r_air)}, yang berdiri di atas sebidang tanah Hak Milik Nomor ${B(v.r_shm)} seluas ${lu} M2 (${tb(lu)} meter persegi), sebagaimana diuraikan dalam Akta Jual Beli ${B(v.r_akta)}, Sertipikat tertanggal ${D(v.r_sert)}, terdaftar atas nama ${U(v.o_nama)}, terletak di ${B(v.r_lokasi)};`)}
${q('B. satu dan lain hal yang keadaannya telah diketahui oleh PENYEWA, sehingga kedua belah pihak menganggap tidak perlu menguraikan lebih lanjut dalam Perjanjian ini; untuk selanjutnya disebut juga <b>OBJEK SEWA</b>;')}
${q('Demikian dengan memakai syarat-syarat dan perjanjian-perjanjian seperti di bawah ini:')}
${P(1,'Jangka Waktu Sewa',q(`1.1 Perjanjian Sewa Menyewa ini dilangsungkan untuk jangka waktu <b>${c.lama}</b>, terhitung mulai tanggal ${DW(v.mulai)} sampai dengan tanggal ${DW(c.akhir)}.`)+q('1.2 Dalam hal salah satu pihak berkehendak memperpanjang jangka waktu sewa menyewa tersebut pada ayat 1.1 dari Perjanjian ini, maka kehendaknya itu harus diberitahukan kepada dan mendapat persetujuan tertulis dari pihak lainnya, dalam waktu 3 (tiga) bulan sebelum jangka waktu persewaan tersebut berakhir dengan syarat-syarat dan perjanjian-perjanjian serta harga sewa yang akan ditetapkan kemudian secara musyawarah.')+q('1.3 Perjanjian Sewa Menyewa ini tidak akan berhenti sebelum jangka waktu tersebut pada ayat 1.1 berakhir dan juga tidak akan berhenti karena salah satu pihak meninggal dunia, pailit atau dipindahtangankannya secara bagaimanapun atas OBJEK SEWA kepada pihak lain sebelum jangka waktu persewaan tersebut berakhir.')+q('1.4 Dalam hal salah satu pihak meninggal dunia, maka ahli warisnya atau penggantinya menurut hukum berhak dan diwajibkan untuk memenuhi ketentuan-ketentuan atau melanjutkan perjanjian sewa menyewa ini sampai jangka waktu persewaan tersebut berakhir, sedangkan dalam hal OBJEK SEWA dipindahtangankan kepada pihak lain, maka pemilik baru atas OBJEK SEWA harus tunduk kepada syarat-syarat dan ketentuan-ketentuan yang tercantum dalam Perjanjian Sewa Menyewa ini.'))}
${P(2,'Harga Sewa',q(`2.1 Harga sewa telah disetujui oleh PARA PIHAK sebesar <b>${rp(c.tot)},-</b> (<i style="text-transform:capitalize">${rpw(c.tot)}</i>) untuk jangka waktu sewa ${c.lama}, yang akan dibayar lunas pada saat Perjanjian Sewa Menyewa ini ditandatangani dan atas pembayaran tersebut akan diberikan kwitansi oleh PEMILIK, melalui transfer ke rekening bank PEMILIK sebagai berikut:<table class="k"><tr><td>Nama Bank</td><td>:</td><td>${B(v.o_bank)}</td></tr><tr><td>Nomor Rekening</td><td>:</td><td>${B(v.o_norek)}</td></tr><tr><td>Nama Pemilik Rekening</td><td>:</td><td style="text-transform:uppercase">${B(v.o_an)}</td></tr></table>`)+q('2.2 Pajak Penghasilan (PPh) dan/atau pajak-pajak lain yang timbul dari Perjanjian Sewa Menyewa ini dibayar oleh PIHAK PEMILIK.')+q('2.3 Apabila pada saat penandatanganan Perjanjian ini PENYEWA ternyata tidak melakukan pembayaran sebagaimana dimaksud dalam Pasal 2 ayat 1 Perjanjian ini, maka Perjanjian ini akan dianggap batal dan semua pembayaran di awal yang telah diterima oleh PEMILIK dari PENYEWA tetap menjadi hak PEMILIK dan tidak dapat diminta kembali dengan alasan apa pun dan PENYEWA harus mengosongkan rumah tersebut dalam waktu 1 (satu) bulan.'))}
${P(3,'Renovasi, Pemeliharaan dan Perbaikan',q('3.1 PENYEWA atas biaya dan risikonya sendiri diperbolehkan untuk merenovasi (perubahan/penambahan/perbaikan) OBJEK SEWA sepanjang tidak merusak struktur OBJEK SEWA, dengan persetujuan terlebih dahulu dari PEMILIK, dengan ketentuan bahwa setelah sewa menyewa ini berakhir, maka renovasi/perubahan/penambahan/perbaikan dimaksud yang bersifat melekat permanen menjadi milik PEMILIK sepenuhnya dan PENYEWA tidak berhak meminta uang ganti kerugian berupa apa pun juga kepada PEMILIK.')+q('3.2 PENYEWA diwajibkan memelihara dan merawat apa yang disewanya tersebut dengan sewajarnya dan atas biaya PENYEWA sendiri, termasuk mengecat dinding-dinding di mana pemeliharaan, perawatan atau pengecatan ini dibutuhkan akibat dari perbuatan PENYEWA atau karyawan PENYEWA.')+q('3.3 Segala perbaikan kecil seperti memperbaiki, mengganti kaca-kaca jendela/pintu yang pecah, kunci-kunci dan engsel-engsel yang rusak, harus dilakukan oleh PENYEWA atas biayanya sendiri di mana pemecahan atau kerusakan atau penggantian tersebut terjadi akibat dari perbuatan PENYEWA atau karyawan PENYEWA.')+q('3.4 PEMILIK atau wakilnya yang sah dengan persetujuan PENYEWA diperbolehkan memeriksa setempat, apakah yang disewakan itu dirawat dan dipelihara dengan baik oleh PENYEWA.')+q('3.5 Apabila diperlukan, maka PARA PIHAK akan membuat Berita Acara Serah Terima OBJEK SEWA yang memuat kondisi detail tentang OBJEK SEWA yang diserahterimakan. Berita Acara Serah Terima OBJEK SEWA sebagaimana dimaksud adalah satu kesatuan yang tidak terpisahkan dari Perjanjian ini.'))}
${P(4,'Peruntukan/Penggunaan Objek Sewa',q('4.1 PENYEWA hanya dapat mempergunakan apa yang disewanya tersebut sebagai rumah tinggal dan dilarang mempergunakan apa yang disewanya tersebut untuk keperluan yang melanggar hukum yang berlaku di Negara Republik Indonesia.')+q('4.2 PENYEWA dilarang mempergunakan apa yang disewanya tersebut sebagai tempat penyimpanan barang-barang berbahaya dan mengandung unsur peledak/bisa meledak seperti mesiu, petasan, bensin dan bahan bakar lainnya, narkotika, psikotropika, zat adiktif dan obat-obatan terlarang lainnya.')+q('4.3 PENYEWA dilarang mempergunakan apa yang disewanya tersebut untuk kegiatan-kegiatan yang dapat mengganggu ketertiban umum dan lingkungan seperti kegiatan asusila, perjudian dan lain-lain.')+q('4.4 PENYEWA dilarang memindahkan hak sewanya atas OBJEK SEWA kepada pihak lain, kecuali telah mendapat persetujuan tertulis terlebih dahulu dari PEMILIK.')+q('4.5 PENYEWA diwajibkan atas biaya sendiri memenuhi segala aturan Pemerintah Daerah mengenai orang yang menghuni rumah/bangunan sewa atau orang yang menjalankan suatu usaha.')+q('4.6 Selama sewa menyewa berlangsung PENYEWA bertanggung jawab penuh atas segala kegiatan yang dilakukan PENYEWA di dalam OBJEK SEWA, dan karenanya dengan ini membebaskan PEMILIK dari segala tagihan, tuntutan dan gugatan dari pihak mana pun.'))}
${P(5,'Rekening, Iuran-iuran dan PBB',q('5.1 Pembayaran rekening-rekening listrik, air, telepon, retribusi sampah, selokan, keamanan, dan iuran-iuran lingkungan lainnya selama sewa menyewa ini berlangsung wajib dipikul dan dibayar oleh PIHAK PENYEWA.')+q('5.2 Pajak Bumi dan Bangunan (PBB) untuk OBJEK SEWA wajib dipikul dan dibayar oleh PIHAK PEMILIK dihitung prorata dimulai dari masa sewa hingga berakhirnya Perjanjian ini. Sedangkan kenaikan nilai PBB yang timbul akibat renovasi OBJEK SEWA (apabila ada) ditanggung sepenuhnya oleh PENYEWA.'))}
${P(6,'Keadaan Memaksa (Force Majeure)',q('6.1 Selama persewaan ini berlangsung, PENYEWA tidak bertanggung jawab atas kerusakan dan/atau kemusnahan yang mungkin terjadi pada OBJEK SEWA yang disebabkan oleh gempa bumi, kebakaran, keretakan pada dinding, kesalahan struktural atau kerusakan pada konstruksi OBJEK SEWA dan hal-hal lainnya di luar kesalahan/kelalaian PENYEWA, bukan disebabkan atau akibat dari perbuatan PENYEWA atau karyawan PENYEWA tetapi semata-mata karena bencana alam pada umumnya.')+q('6.2 Dalam kejadian-kejadian seperti tersebut dalam pasal ini, maka PEMILIK diwajibkan atas biayanya sendiri untuk membetulkan/memperbaiki kembali apa yang disewakan tersebut dimulai sejak 7 (tujuh) hari setelah diberitahukan secara tertulis oleh PENYEWA.')+q('6.3 Dalam hal PEMILIK melalaikan kewajibannya, maka PENYEWA berhak dan dianggap telah diberi kuasa untuk membetulkan/memperbaiki atau membangun kembali kerusakan atau kemusnahan yang terjadi pada OBJEK SEWA atas biaya, ongkos dan risiko PEMILIK sepenuhnya.')+q('6.4 Untuk risiko-risiko tersebut PEMILIK harus mengasuransikan OBJEK SEWA atas biaya sendiri, sedangkan PENYEWA harus mengasuransikan seluruh barang-barang milik PENYEWA yang berada di dalam dan/atau di sekitar OBJEK SEWA terhadap bahaya kebakaran dan/atau bahaya lainnya atas biaya PENYEWA sendiri.')+q('6.5 Selama persewaan ini berlangsung, PENYEWA bertanggung jawab atas kerusakan yang mungkin terjadi pada OBJEK SEWA yang disebabkan oleh atau sebagai akibat dari kesalahan/kelalaian PENYEWA atau orang yang di bawah kontrol PENYEWA atau karyawan PENYEWA, dan dalam kejadian demikian, maka PENYEWA diwajibkan atas biaya, ongkos dan risikonya sendiri untuk membetulkan/memperbaiki kembali apa yang disewanya tersebut seperti kondisi semula, selambat-lambatnya 7 (tujuh) hari sejak kerusakan tersebut terjadi.'))}
${P(7,'Berakhirnya Sewa dan Serah Terima',q('7.1 PENYEWA akan menerima OBJEK SEWA menurut keadaan pada saat PENYEWA menerimanya dari PEMILIK, yakni dalam kondisi terawat baik, dan oleh karena itu pada waktu Perjanjian Sewa Menyewa ini berakhir PENYEWA diwajibkan untuk menyerahkan kembali OBJEK SEWA menurut keadaan sebagaimana PENYEWA menerimanya dari PEMILIK.')+q(`7.2 Apabila sewa menyewa ini berhenti karena berakhir jangka waktunya dan tidak dilanjutkan/diperpanjang menurut ketentuan dalam Pasal 1 Perjanjian ini, maka PENYEWA diwajibkan untuk menyerahkan kembali OBJEK SEWA kepada PEMILIK dalam keadaan tidak dihuni, terpelihara baik dan berikut kunci-kunci selengkapnya, selambat-lambatnya tanggal ${DW(c.akhir)}.`))}
${P(8,'Pengosongan Objek Sewa',q('PENYEWA sekarang ini juga untuk nanti pada waktunya, yaitu dalam hal PENYEWA melalaikan kewajibannya untuk menyerahkan kembali OBJEK SEWA dalam keadaan kosong berikut kunci-kunci selengkapnya pada waktu sewa menyewa ini berakhir, memberi kuasa kepada PEMILIK dengan hak substitusi untuk: a. mengeluarkan PENYEWA dan/atau pihak lainnya yang menempati OBJEK SEWA; b. mengeluarkan semua barang dan perabot yang terdapat dalam OBJEK SEWA, baik kepunyaan PENYEWA maupun kepunyaan pihak lain; c. jika perlu menghubungi dan dengan bantuan pihak yang berwajib untuk melaksanakan ketentuan huruf a dan huruf b tersebut; d. menjalankan segala tindakan yang perlu dan berguna agar dapat menerima kembali OBJEK SEWA dalam keadaan tidak dihuni berikut kunci-kunci selengkapnya; satu dan lainnya atas biaya dan risiko PENYEWA sepenuhnya, dan mengenai pengosongan tersebut PEMILIK dibebaskan dari tuntutan perdata dan pidana.'))}
${P(9,'Wanprestasi',q('9.1 Apabila PENYEWA melanggar salah satu atau lebih syarat-syarat serta ketentuan-ketentuan dalam Perjanjian Sewa Menyewa ini, maka PEMILIK dapat dengan segera mengakhiri Perjanjian Sewa Menyewa ini, tanpa meminta persetujuan terlebih dahulu dari PENYEWA dan tanpa kewajiban PEMILIK untuk mengembalikan seluruh/sebagian uang sewa yang telah diterima, demikian pula jika PENYEWA membatalkan Perjanjian Sewa Menyewa ini dengan alasan apa pun juga, maka PEMILIK tidak berkewajiban mengembalikan seluruh/sebagian uang sewa yang telah diterima, kecuali PEMILIK nyata-nyata melanggar salah satu atau lebih syarat-syarat serta ketentuan-ketentuan dalam Perjanjian Sewa Menyewa ini.')+q('9.2 Selama masa sewa berlangsung, manakala dalam waktu 3 (tiga) bulan berturut-turut PENYEWA meninggalkan bangunan yang disewa dengan Perjanjian ini dan dibiarkan dalam keadaan dikosongkan dan/atau ditelantarkan, sehingga apa yang disewa dengan Perjanjian ini rusak dan/atau rekening-rekening listrik, air, telepon dan dana-dana keamanan tidak dibayar, dalam hal mana: a. PEMILIK berhak menguasai kembali apa yang disewakan dengan Perjanjian ini, jika perlu dengan merusak kunci-kuncinya dan/atau dengan bantuan pihak yang berwajib, semuanya itu atas risiko dan biaya PENYEWA sendiri; b. Perjanjian sewa ini dianggap berakhir dengan sendirinya dan PEMILIK dengan ini dibebaskan oleh PENYEWA untuk mengembalikan sisa uang sewa atas masa sewa yang belum dipergunakan, dengan melepaskan ketentuan Pasal 1266 dan Pasal 1267 Kitab Undang-Undang Hukum Perdata.')+q('9.3 Apabila pada saat masa sewa berlangsung PENYEWA di luar kehendaknya dipaksa untuk meninggalkan OBJEK SEWA dikarenakan adanya cacat pada dokumen legalitas OBJEK SEWA, adanya kebijakan Pemerintah yang mengakibatkan OBJEK SEWA tidak dapat ditinggali, atau renovasi atas kehendak pribadi PEMILIK yang menyebabkan OBJEK SEWA tidak dapat ditinggali, maka PEMILIK harus bersedia untuk: a. Menyediakan tempat tinggal lain bagi PENYEWA selama waktu yang disepakati PARA PIHAK dengan biaya dan risiko yang ditanggung oleh PEMILIK; atau b. Mengembalikan uang masa sewa yang belum dijalani secara pro rata dihitung berdasarkan Jangka Waktu Sewa pada Pasal 1 ayat (1) Perjanjian ini.'))}
${P(10,'Domisili Hukum',q('10.1 Segala macam perselisihan dan kelalaian yang timbul dari atau dalam pelaksanaan Perjanjian ini, pada dasarnya akan diselesaikan secara musyawarah dan mufakat.')+q(`10.2 Apabila dengan jalan musyawarah dan mufakat tidak dapat diselesaikan, maka PARA PIHAK sepakat untuk menyelesaikannya di Pengadilan Negeri ${B(v.pn)}.`)+q('10.3 Putusan Pengadilan merupakan keputusan tertinggi dan mengikat bagi PARA PIHAK.'))}
${P(11,'Jaminan',q('11.1 PEMILIK menjamin kepada PENYEWA bahwa OBJEK SEWA tersebut betul adalah hak dan milik PEMILIK sendiri, bebas dari sitaan, tidak dijaminkan dalam bentuk apa pun dan tidak sedang disewakan kepada pihak lain dan bahwa selama sewa menyewa ini berlangsung PENYEWA tidak akan mendapat tuntutan dan/atau gangguan dari pihak lain yang menyatakan mempunyai hak lebih dahulu atau turut mempunyai hak atas apa yang disewakan tersebut, karenanya PEMILIK dengan ini membebaskan PENYEWA dari hal-hal tersebut.')+q('11.2 Apabila OBJEK SEWA tersebut sedang dijaminkan di bank, maka PEMILIK wajib untuk meminta surat persetujuan dari bank yang bersangkutan untuk dapat menyewakan OBJEK SEWA tersebut dan dilampirkan pada Perjanjian ini.')+q('11.3 PARA PIHAK dengan ini menjamin bahwa surat atau dokumen dan identitas PARA PIHAK yang dipakai dalam pembuatan Perjanjian Sewa Menyewa ini, sebelum Perjanjian ini ditandatangani adalah benar adanya dan bertanggung jawab sepenuhnya atas hal tersebut dan selanjutnya PARA PIHAK juga menyatakan telah mengerti dan memahami isi Perjanjian Sewa Menyewa ini.')+q('11.4 Segala klausul yang dimuat dalam Perjanjian ini telah sesuai dengan kesepakatan antara PEMILIK dan PENYEWA sehingga sepenuhnya menjadi tanggung jawab PEMILIK dan PENYEWA.'))}
${P(12,'Penutup',q('12.1 Hal-hal yang belum cukup diatur dalam Perjanjian ini, termasuk tetapi tidak terbatas pada hal-hal mengenai perubahan-perubahan dan tambahan-tambahannya akan diatur oleh PARA PIHAK dalam Addendum tertulis tersendiri yang merupakan suatu kesatuan dan tidak terpisahkan dari Perjanjian ini.')+q('12.2 Apabila suatu ketentuan atau lebih dari Perjanjian ini menjadi batal, tidak sah atau tidak dapat diberlakukan dalam setiap hal, maka ketentuan-ketentuan lainnya yang tercantum dalam Perjanjian ini tidak akan terkena atau dikurangi sama sekali dan untuk itu PARA PIHAK harus segera mengubah Perjanjian ini untuk memperbaiki keadaan batal, tidak sah dan tidak dapat diberlakukan menurut hukum dan melakukan usaha untuk memungkinkan terlaksananya tujuan yang dimaksud oleh ketentuan yang batal.')+q('12.3 Apabila terjadi pengakhiran yang disebabkan oleh kesalahan, kelalaian, dan/atau pelanggaran Perjanjian ini, PARA PIHAK sepakat untuk mengesampingkan keberlakuan Pasal 1266 dan Pasal 1267 Kitab Undang-Undang Hukum Perdata.')+q('12.4 PARA PIHAK setuju untuk melaksanakan Perjanjian ini dengan itikad baik dan penuh tanggung jawab.')+q('12.5 Perjanjian ini serta hak dan kewajiban PARA PIHAK yang timbul berdasarkan Perjanjian ini harus tunduk dan ditafsirkan sesuai dengan hukum yang berlaku di Negara Republik Indonesia.')+q(wna?'12.6 Perjanjian ini dibuat dan ditandatangani dalam bahasa Indonesia sesuai dengan peraturan perundang-undangan yang berlaku di Negara Republik Indonesia. Terjemahan Perjanjian ini dalam bahasa Inggris dibuat hanya sebagai referensi bagi PENYEWA. Apabila terdapat perbedaan atau pertentangan penafsiran antara versi bahasa Indonesia dan versi bahasa Inggris, maka versi bahasa Indonesia yang berlaku dan mengikat PARA PIHAK. PENYEWA menyatakan telah membaca dan memahami isi Perjanjian ini, termasuk melalui terjemahan bahasa Inggris yang diberikan kepadanya sebelum penandatanganan.':'12.6 Perjanjian ini dibuat dan ditandatangani dalam bahasa Indonesia sesuai dengan peraturan perundang-undangan yang berlaku di Negara Republik Indonesia.'))}

function hist(){const h=ld('hist')||[];$('#hist').innerHTML=h.length?h.map((x,i)=>`<div class="h"><div><b>${esc(x.p_nama)||'(tanpa nama)'}</b><br><small>${esc(x.r_lokasi).slice(0,40)} · ${D(x.mulai)}</small></div><button onclick="ld2(${i})">Buka</button><button onclick="del(${i})">Hapus</button></div>`).join(''):'<p>Belum ada data tersimpan.</p>'}
window.ld2=i=>{setAll(ld('hist')[i]);render();tab('f')};window.del=i=>{if(!confirm('Hapus data ini?'))return;const h=ld('hist');h.splice(i,1);sv('hist',h);hist()};
function tab(t){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.id==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));if(t=='h')hist();scrollTo(0,0)}
window.pr=t=>{document.querySelectorAll('.tab').forEach(e=>e.classList.remove('pr'));$('#'+t).classList.add('pr');print()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
document.addEventListener('input',()=>{const v=get();sv('owner',Object.fromEntries(OWN.map(k=>[k,v[k]])));render()});
$('#save').onclick=()=>{const h=ld('hist')||[];h.unshift(get());sv('hist',h.slice(0,200));alert('Tersimpan ✔')};
